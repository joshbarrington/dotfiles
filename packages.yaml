# run after stow; each writes its files into ~/.config/opencode
opencode_integrations:
  - herdr integration install opencode
  - 'd=$(mktemp -d) && git clone -q --depth 1 https://github.com/umputun/revdiff "$d" && bash "$d/plugins/opencode/setup.sh"'
